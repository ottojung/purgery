root = "/universe/synced"
purgery_root = "/universe/tmp/purgery"
state_dir = "/var/lib/purgery"
log_dir = "/var/log/purgery"

[postprocess]
max_parallel_jobs = 1

[postprocess.steps.compress-video]
kind = "subprocess"
program = "my-compress-video"
args = ["--input", "{input}"]
expected_outputs = ["{stem}.Z.webm"]
keep_original = true
