#
# Put this file at the server's config path.
# For example, if your server is user1@example.com
# then this file probably belongs at `/home/user1/.config/purgery/server.toml`.
#

work_dir = ".local/state/purgery/work"

[[transform]]
name = "compress-video"
kind = "subprocess"
program = "my-compress-video"
args = ["--input", "{input}", "--output", "{target_directory}/{target_file_stem}.Z.webm"]
expected_outputs = ["{target_directory}/{target_file_stem}.Z.webm"]
