[package]
name = "purgery-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1.1"
thiserror = "2"
camino = { version = "1", features = ["serde1"] }
sha2 = "0.10"
ulid = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }
atty = "0.2"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
