[package]
name = "purgery-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
purgery-core = { path = "../purgery-core" }
anyhow = "1"
camino = { version = "1", features = ["serde1"] }
libc = "0.2"
regex = "1"
toml = "1.1"
tracing = "0.1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
