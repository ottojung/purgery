name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      (
        startsWith(github.event.comment.body, 'plsoc') ||
        startsWith(github.event.comment.body, 'plsocz') ||
        startsWith(github.event.comment.body, '/opencode-pro-zen') ||
        startsWith(github.event.comment.body, '/opencode')
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Select model
        id: select-model
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          first_token="$(printf '%s\n' "$COMMENT_BODY" | awk 'NF { print $1; exit }')"

          case "$first_token" in
            /opencode-pro-zen)
              echo 'run=true' >> "$GITHUB_OUTPUT"
              echo 'model=opencode/deepseek-v4-pro' >> "$GITHUB_OUTPUT"
              ;;

            plsocz)
              echo 'run=true' >> "$GITHUB_OUTPUT"
              echo 'model=opencode/deepseek-v4-flash' >> "$GITHUB_OUTPUT"
              ;;

            /opencode-pro)
              echo 'run=true' >> "$GITHUB_OUTPUT"
              echo 'model=opencode-go/deepseek-v4-pro' >> "$GITHUB_OUTPUT"
              ;;

            /opencode|plsoc)
              echo 'run=true' >> "$GITHUB_OUTPUT"
              echo 'model=opencode-go/deepseek-v4-flash' >> "$GITHUB_OUTPUT"
              ;;

            *)
              echo 'run=false' >> "$GITHUB_OUTPUT"
              echo "Ignoring non-opencode command: $first_token"
              ;;
          esac

      - name: Run opencode
        if: steps.select-model.outputs.run == 'true'
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ steps.select-model.outputs.model }}
          mentions: /opencode-pro-zen,/opencode-pro,/opencode,plsocz,plsoc
          
